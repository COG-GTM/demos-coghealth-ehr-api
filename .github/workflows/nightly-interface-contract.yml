name: Nightly interface contract

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      export_date:
        description: 'HR export date (yyyyMMdd); default = latest file'
        required: false
        default: ''
  pull_request:
    paths:
      - 'src/main/resources/interfaces/**'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Compile
        run: mvn -B -q compile

      - name: Interface contract
        env:
          EXPORT_DATE: ${{ inputs.export_date }}
        run: mvn -B test -Dgroups=interface-contract -Dhr.export.date="${EXPORT_DATE}"

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-contract
          path: target/interface-contract/
          if-no-files-found: warn
